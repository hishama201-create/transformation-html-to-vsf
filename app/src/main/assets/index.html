<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup Pro</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin:0; background:#f4f5f7; }
  header { background:#2f4157; color:#fff; padding:18px; text-align:center; font-size:20px; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid #ddd; }
  .tab { flex:1; padding:12px; text-align:center; cursor:pointer; font-size:14px; }
  .tab.active { border-bottom:3px solid #3aafa9; color:#3aafa9; font-weight:bold; }
  .page { display:none; padding:20px; }
  .page.active { display:block; }
  button { background:#3aafa9; color:#fff; border:none; padding:12px 16px; border-radius:8px; font-size:15px; width:100%; margin-top:10px; }
  .card { background:#fff; padding:16px; border-radius:10px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  #log { white-space:pre-wrap; font-size:13px; color:#444; margin-top:10px; }
  input[type=file]{ width:100%; }
</style>
</head>
<body>
<header>Backup Pro</header>
<div class="tabs">
  <div class="tab active" onclick="showPage('sms')">الرسائل</div>
  <div class="tab" onclick="showPage('contacts')">جهات الاتصال</div>
  <div class="tab" onclick="showPage('convert')">HTML → VCF</div>
  <div class="tab" onclick="showPage('about')">حول</div>
</div>

<div id="sms" class="page active">
  <div class="card">
    <p>نسخ احتياطي لكل الرسائل النصية إلى ملف JSON داخل مجلد Downloads.</p>
    <button onclick="doBackupSms()">ابدأ النسخ الاحتياطي للرسائل</button>
    <div id="smsLog" class="log"></div>
  </div>
</div>

<div id="contacts" class="page">
  <div class="card">
    <p>نسخ احتياطي لكل جهات الاتصال إلى ملف VCF داخل مجلد Downloads.</p>
    <button onclick="doBackupContacts()">ابدأ النسخ الاحتياطي لجهات الاتصال</button>
    <div id="contactsLog" class="log"></div>
  </div>
</div>

<div id="convert" class="page">
  <div class="card">
    <p>اختر ملف HTML يحتوي جدول (اسم، رقم) وسيتم تحويله إلى VCF بدون فقد أي اسم.</p>
    <input type="file" id="htmlFile" accept=".html,.htm">
    <button onclick="convertHtmlToVcf()">تحويل وتنزيل VCF</button>
    <div id="log"></div>
  </div>
</div>

<div id="about" class="page">
  <div class="card" id="aboutCard">جارِ التحميل...</div>
</div>

<script>
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function doBackupSms(){
  const result = Android.backupSms();
  document.getElementById('smsLog').innerText = result;
}
function doBackupContacts(){
  const result = Android.backupContacts();
  document.getElementById('contactsLog').innerText = result;
}

// تحميل معلومات حول التطبيق
try {
  const info = JSON.parse(Android.getAppInfo());
  document.getElementById('aboutCard').innerHTML =
    "الإصدار: " + info.version + "<br>المطور: " + info.developer;
} catch(e) {
  document.getElementById('aboutCard').innerText = "تعذر تحميل المعلومات";
}

// ---- تحويل HTML إلى VCF (بدون فقد أي اسم) ----
function convertHtmlToVcf(){
  const fileInput = document.getElementById('htmlFile');
  const logEl = document.getElementById('log');
  if(!fileInput.files.length){ logEl.innerText = "اختر ملف HTML أولاً"; return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result;
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");

    let entries = [];

    // المحاولة 1: قراءة من جدول (tr > td)
    const rows = doc.querySelectorAll("tr");
    if (rows.length > 0){
      rows.forEach(row=>{
        const cells = row.querySelectorAll("td, th");
        if (cells.length >= 2){
          const name = cells[0].textContent.trim();
          const number = cells[1].textContent.trim();
          if (name || number){
            entries.push({name: name || "بدون اسم", number: number});
          }
        }
      });
    }

    // المحاولة 2: إن لم يوجد جدول، اقرأ كل الأسطر (اسم ثم رقم بالتناوب)
    if (entries.length === 0){
      const bodyText = doc.body.innerText || doc.body.textContent || "";
      const lines = bodyText.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
      for(let i=0; i<lines.length; i+=2){
        const name = lines[i] || "بدون اسم";
        const number = lines[i+1] || "";
        entries.push({name, number});
      }
    }

    if (entries.length === 0){
      logEl.innerText = "لم يتم العثور على بيانات قابلة للتحويل";
      return;
    }

    let vcf = "";
    entries.forEach(en=>{
      vcf += "BEGIN:VCARD\nVERSION:3.0\nFN:" + en.name + "\nTEL:" + en.number + "\nEND:VCARD\n";
    });

    const blob = new Blob([vcf], {type:"text/vcard"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "contacts_converted.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();

    logEl.innerText = "تم التحويل بنجاح: " + entries.length + " جهة اتصال";
  };
  reader.readAsText(fileInput.files[0], "UTF-8");
}
</script>
</body>
</html>
