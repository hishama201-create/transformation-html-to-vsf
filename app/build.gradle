apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// ================== إعدادات التوقيع (بدون كلمات سر ثابتة في الكود) ==================
// المصدر الأول: ملف keystore.properties محلي (غير مرفوع للريبو، موجود في .gitignore).
// المصدر الثاني (يُستخدم في GitHub Actions): متغيرات بيئة KEYSTORE_*.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def resolvedStoreFile = keystoreProps["storeFile"] ?: System.getenv("KEYSTORE_FILE")
def resolvedStorePassword = keystoreProps["storePassword"] ?: System.getenv("KEYSTORE_STORE_PASSWORD")
def resolvedKeyAlias = keystoreProps["keyAlias"] ?: System.getenv("KEYSTORE_KEY_ALIAS")
def resolvedKeyPassword = keystoreProps["keyPassword"] ?: System.getenv("KEYSTORE_KEY_PASSWORD")

// ================== رقم الإصدار ==================
// عدّل هذه الأرقام الثلاثة فقط لإطلاق إصدار جديد؛
// versionCode يُحسب تلقائيًا ويزيد دائمًا عند ترقية أي جزء (major/minor/patch)
def VERSION_MAJOR = 1
def VERSION_MINOR = 0
def VERSION_PATCH = 0

android {
    namespace 'com.dev.backupapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.dev.backupapp"
        minSdk 24
        targetSdk 34
        versionCode = VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH
        versionName = "${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
    }

    signingConfigs {
        release {
            if (resolvedStoreFile != null) {
                storeFile rootProject.file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // نفس مفتاح التوقيع الثابت، حتى نسخ debug تُثبَّت كتحديث فوق بعضها دائمًا
            signingConfig signingConfigs.release
        }
        release {
            // R8/ProGuard: يشفّر (obfuscate) أسماء الكلاسات والدوال والمتغيرات في الكود،
            // ويحذف أي كود غير مستخدم — يصعّب كثيرًا على أي حد يفكّ الـ APK فهم منطق التطبيق.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
